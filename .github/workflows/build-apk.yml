# APK በ GitHub Actions ላይ ይሰራል / builds a debug APK in the cloud on every push
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch llama.cpp
        run: git clone --depth 1 --branch b9999 https://github.com/ggml-org/llama.cpp app/src/main/cpp/llama.cpp
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
